name: macOS release

on:
  push:
    tags:
      - v1.0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.0.1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and score soundfont
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Create macOS application icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fretroom.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" build/icon.png --out "build/fretroom.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" build/icon.png --out "build/fretroom.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/fretroom.iconset -o build/icon.icns
      - name: Package unsigned macOS app
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Save downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fretroom-1.0.1-mac-${{ matrix.arch }}
          path: |
            release/fretroom-1.0.1-mac-${{ matrix.arch }}.dmg
            release/fretroom-1.0.1-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Upload DMG and ZIP to existing v1.0.1 release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.1 >/dev/null
          gh release upload v1.0.1 \
            "release/fretroom-1.0.1-mac-${{ matrix.arch }}.dmg" \
            "release/fretroom-1.0.1-mac-${{ matrix.arch }}.zip" \
            --clobber
