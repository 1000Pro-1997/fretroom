name: macOS release

on:
  push:
    tags:
      - v1.0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v1.0.1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and score soundfont
        run: npm ci
      - name: Build and package unsigned macOS app
        run: npm run package:mac -- ${{ matrix.arch }}
      - name: Save downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fretroom-1.0.1-mac-${{ matrix.arch }}
          path: |
            release/fretroom-1.0.1-mac-${{ matrix.arch }}.dmg
            release/fretroom-1.0.1-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
      - name: Upload DMG and ZIP to existing v1.0.1 release
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.1 >/dev/null
          gh release upload v1.0.1 \
            "release/fretroom-1.0.1-mac-${{ matrix.arch }}.dmg" \
            "release/fretroom-1.0.1-mac-${{ matrix.arch }}.zip" \
            --clobber
